<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confira seu e-mail</title>

    <link rel="stylesheet" href="/assets/css/global.css">
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
    
    :root{
        --navy-950:#001629;
        --navy-900:#012A4A;
        --blue-500:#1C7ED6;
        --yellow-400:#FFCB3D;
        --yellow-500:#F5B700;
        --paper:#FFFFFF;
        --panel:#EFF5FB;
        --ink:#0B1E2E;
        --muted:#5B6B7A;
        --radius-lg:26px;
        --radius-md:14px;
    }
    
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Inter",sans-serif;
    }
    
    body{
    
        min-height:100vh;
    
        display:flex;
        justify-content:center;
        align-items:center;
    
        padding:30px;
    
        background:
            radial-gradient(600px 400px at 12% -5%, rgba(255,203,61,.18), transparent 60%),
            radial-gradient(700px 500px at 110% 15%, rgba(28,126,214,.35), transparent 60%),
            linear-gradient(180deg,var(--navy-950),var(--navy-900));
    
    }
    
    .container{
        width:100%;
        max-width:620px;
    }
    
    .hero{
    
        position:relative;
    
        background:var(--paper);
        color:var(--ink);
    
        border-radius:var(--radius-lg);
    
        padding:42px 34px;
    
        box-shadow:
            0 24px 60px rgba(0,12,24,.45);
    
        animation:rise .5s ease;
    
    }
    
    @keyframes rise{
    
        from{
            opacity:0;
            transform:translateY(18px);
        }
    
        to{
            opacity:1;
            transform:translateY(0);
        }
    
    }
    
    .hero::before{
    
        content:"📨";
    
        position:absolute;
    
        top:-24px;
        right:28px;
    
        width:82px;
        height:82px;
    
        display:flex;
        align-items:center;
        justify-content:center;
    
        border-radius:50%;
    
        background:
            linear-gradient(135deg,var(--yellow-400),var(--yellow-500));
    
        font-size:2rem;
    
        box-shadow:
            0 12px 28px rgba(245,183,0,.35),
            0 0 0 6px white;
    
    }
    
    .evento{
    
        display:inline-block;
    
        background:
            linear-gradient(135deg,var(--navy-950),var(--blue-500));
    
        color:white;
    
        padding:7px 18px;
    
        border-radius:999px;
    
        font-family:"Space Grotesk",sans-serif;
        font-weight:700;
        font-size:.78rem;
    
        letter-spacing:1px;
        text-transform:uppercase;
    
        margin-bottom:22px;
    
    }
    
    .hero h1{
    
        font-family:"Space Grotesk",sans-serif;
    
        font-size:2rem;
    
        color:var(--navy-950);
    
        margin-bottom:10px;
    
    }
    
    .hero h1::after{
    
        content:"";
    
        display:block;
    
        width:48px;
        height:5px;
    
        margin-top:12px;
    
        border-radius:4px;
    
        background:
            linear-gradient(90deg,var(--yellow-500),var(--blue-500));
    
    }
    
    .descricao{
    
        color:var(--muted);
    
        line-height:1.7;
    
        margin-bottom:28px;
    
    }
    
    .card-info{
    
        background:var(--panel);
    
        border-left:5px solid var(--yellow-500);
    
        border-radius:var(--radius-md);
    
        padding:22px;
    
    }
    
    .card-info h2{
    
        font-family:"Space Grotesk",sans-serif;
    
        color:var(--navy-950);
    
        margin-bottom:12px;
    
    }
    
    .card-info p{
    
        color:var(--muted);
    
        line-height:1.7;
    
        margin-bottom:14px;
    
    }
    
    .card-info p:last-child{
    
        margin-bottom:0;
    
    }
    
    strong{
    
        color:var(--navy-950);
    
    }
    
    .email-icon{
    
        display:flex;
        justify-content:center;
    
        font-size:4rem;
    
        margin-bottom:20px;
    
        animation:pulse 2s infinite;
    
    }
    
    @keyframes pulse{
    
        0%{
            transform:scale(1);
        }
    
        50%{
            transform:scale(1.08);
        }
    
        100%{
            transform:scale(1);
        }
    
    }
    
    .obs{
    
        margin-top:28px;
    
        text-align:center;
    
        color:rgba(255,255,255,.7);
    
        font-size:.9rem;
    
    }
    
    @media(max-width:768px){
    
        .hero{
    
            padding:34px 24px;
    
        }
    
        .hero h1{
    
            font-size:1.8rem;
    
        }
    
        .hero::before{
    
            width:72px;
            height:72px;
    
            font-size:1.7rem;
    
        }
    
    }
    </style>
<body>

<section class="home">

    <div class="container">

        <div class="hero">

            <span class="evento">
                Quase lá
            </span>

            <h1>Confira seu e-mail</h1>

            <p class="descricao">

                Enviamos um link de acesso para o endereço informado.

            </p>

            <div class="card-info">

                <h2>📧 Próximo passo</h2>

                <p>

                    Abra seu e-mail e clique no botão
                    <strong>"Voltar para o Quiz"</strong>.

                </p>

                <p>

                    Somente após clicar no link você poderá iniciar o questionário.

                </p>

            </div>

        </div>

    </div>

</section>

</body>
</html>
