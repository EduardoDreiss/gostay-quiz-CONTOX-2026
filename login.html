<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Validando acesso...</title>

    <script
        type="module"
        src="/assets/js/pages/login.js">
    </script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        :root{
            --navy-950:#001629;
            --navy-900:#012A4A;
            --blue-500:#1C7ED6;
            --yellow-400:#FFCB3D;
            --yellow-500:#F5B700;
            --paper:#FFFFFF;
            --ink:#0B1E2E;
            --muted:#5B6B7A;
            --radius-lg:26px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:30px;

            background:
                radial-gradient(600px 400px at 12% -5%, rgba(255,203,61,.18), transparent 60%),
                radial-gradient(700px 500px at 110% 15%, rgba(28,126,214,.35), transparent 60%),
                linear-gradient(180deg,var(--navy-950),var(--navy-900));

        }

        .card{

            width:100%;
            max-width:520px;

            background:white;

            border-radius:var(--radius-lg);

            padding:50px 40px;

            text-align:center;

            box-shadow:
                0 24px 60px rgba(0,12,24,.45);

            animation:rise .45s ease;

        }

        @keyframes rise{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        h2{

            font-family:"Space Grotesk",sans-serif;

            color:var(--ink);

            font-size:2rem;

            margin-bottom:12px;

        }

        h2::after{

            content:"";

            display:block;

            width:55px;
            height:5px;

            margin:14px auto 0;

            border-radius:5px;

            background:
                linear-gradient(
                    90deg,
                    var(--yellow-500),
                    var(--blue-500)
                );

        }

        p{

            color:var(--muted);

            line-height:1.7;

            margin-top:24px;

        }

        .loader{

            width:90px;
            height:90px;

            margin:35px auto;

            border-radius:50%;

            background:
                conic-gradient(
                    var(--yellow-400),
                    var(--yellow-500),
                    var(--blue-500),
                    var(--yellow-400)
                );

            animation:girar 1s linear infinite;

            display:flex;
            justify-content:center;
            align-items:center;

            box-shadow:
                0 10px 35px rgba(245,183,0,.35);

        }

        .loader::before{

            content:"";

            width:66px;
            height:66px;

            border-radius:50%;

            background:white;

        }

        @keyframes girar{

            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }

        }

        .status{

            margin-top:20px;

            display:flex;
            justify-content:center;
            gap:8px;

        }

        .status span{

            width:10px;
            height:10px;

            border-radius:50%;

            background:var(--yellow-500);

            animation:bounce 1.2s infinite;

        }

        .status span:nth-child(2){
            animation-delay:.2s;
        }

        .status span:nth-child(3){
            animation-delay:.4s;
        }

        @keyframes bounce{

            0%,80%,100%{
                opacity:.35;
                transform:translateY(0);
            }

            40%{
                opacity:1;
                transform:translateY(-8px);
            }

        }

    </style>

</head>

<body>

    <div class="card">

        <div class="loader"></div>

        <h2>
            Validando acesso...
        </h2>

        <p>

            Aguarde alguns instantes enquanto confirmamos seu
            e-mail e preparamos seu acesso ao quiz.

        </p>

        <div class="status">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>

</body>

</html>
