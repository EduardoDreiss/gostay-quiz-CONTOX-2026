<!DOCTYPE html>

<body>
    <nav>
        <div class="container">
            <div class="logo">
                <img src="" alt="logo"> 
            </div>
        </div>
    </nav>
    <section class="home">
        <div class="container">
            <div class="content">
                <h1>Bem vindo</h1>

                <form id="cadastroForm" class="nome">
                    <div class="formNome">
                        <label for="nome">Nome:</label>
                        <input type="text" name="nome" id="nome" required>

                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="formTelefone">
                        <label for="telefone">Telefone</label>
                        <input type="tel" name="telefone" id="telefone" required>
                    </div>
                    <button type="submit">
                        realizar login
                    </button>

                </form>
            </div>
        </div>
    </section>
</body>
